name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: [root, subdirectory]
    env:
      BASE_PATH: ${{ matrix.deployment == 'subdirectory' && format('/{0}', github.event.repository.name) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          run-install: false
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and check types
        run: bun run lint && bun run check
      - name: Install test browsers
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test components and production site
        run: bun run test

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          run-install: false
          cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
